name: iOS Release & App Store Connect Upload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    name: Build, Archive & Upload to App Store Connect
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit & Auto-Select Newest Xcode
        run: |
          echo "================ Installed Xcode Apps ================"
          ls -la /Applications | grep Xcode || true

          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NEWEST_XCODE" ]; then
            echo "Auto-Selecting Newest Xcode: $NEWEST_XCODE"
            sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          fi

          echo "================ Xcode Version ================"
          xcodebuild -version

          echo "================ Active Developer ================"
          xcode-select -p

          echo "================ iPhoneOS SDK ================"
          xcrun --sdk iphoneos --show-sdk-version

          echo "================ Installed SDKs ================"
          xcodebuild -showsdks

      - name: Verify Required SDK Version (Xcode 26+ Check)
        run: |
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "0.0")
          SDK_MAJOR=$(echo "$SDK_VER" | cut -d'.' -f1)

          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "=========================================================================="
            echo "❌ CRITICAL NOTICE: Xcode 26+ (iOS 26 SDK) is NOT installed on this GitHub Actions runner."
            echo "   Active SDK Detected: iphoneos${SDK_VER}"
            echo "   Action: Halting release pipeline before Archive and Upload."
            echo "=========================================================================="
            exit 1
          fi

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | tr -d '"')

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "Installed distribution certificate and provisioning profile successfully."
          fi

      - name: Setup App Store Connect API Key & Validate
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "Error: One or more required App Store Connect secrets are missing."
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "App Store Connect API key validated successfully at $KEY_PATH."

      - name: Archive App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p build
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -archivePath build/Miran.xcarchive \
                     -project Miran.xcodeproj \
                     -scheme Miran \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     TARGETED_DEVICE_FAMILY="1" \
                     SDKROOT=iphoneos \
                     ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_FRAMEWORKS=NO \
                     ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
                     -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
                     -authenticationKeyPath "$KEY_PATH"

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>B4S7M6N5U5</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -exportArchive \
                     -archivePath build/Miran.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist build/ExportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
                     -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
                     -authenticationKeyPath "$KEY_PATH"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/Export/Miran.ipa -t ios --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
