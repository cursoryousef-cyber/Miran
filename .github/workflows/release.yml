name: iOS Release & App Store Connect Upload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    name: Build, Archive & Upload to App Store Connect
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Cache Swift PM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup App Store Connect API Key & Validate
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "Error: One or more required App Store Connect secrets are missing."
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if [ ! -s "$KEY_PATH" ]; then
            echo "Error: Decoded API key file is empty."
            exit 1
          fi

          if ! grep -q "^-----BEGIN PRIVATE KEY-----" "$KEY_PATH" || ! grep -q "^-----END PRIVATE KEY-----" "$KEY_PATH"; then
            echo "Error: API key file format is invalid (missing BEGIN/END PRIVATE KEY headers)."
            exit 1
          fi

          echo "App Store Connect API key validated successfully at $KEY_PATH."

      - name: Archive App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p build
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -archivePath build/Miran.xcarchive \
                     -project Miran.xcodeproj \
                     -scheme Miran \
                     -configuration Release \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
                     -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
                     -authenticationKeyPath "$KEY_PATH"

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>B4S7M6N5U5</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -exportArchive \
                     -archivePath build/Miran.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist build/ExportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
                     -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
                     -authenticationKeyPath "$KEY_PATH"

      - name: Validate IPA & Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f build/Export/Miran.ipa -t ios --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app -f build/Export/Miran.ipa -t ios --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
