name: Miran Platform CI / App Store SDK & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Build & Verify NestJS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Build NestJS Application
        run: |
          cd backend
          npm run build

  frontend-build:
    name: Build & Verify Web Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Dashboard
        run: |
          cd frontend
          npm run build

  ios-build-archive:
    name: Build & Archive Native iOS App (Xcode / iOS SDK Audit)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version & Print SDK Info
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "=== Xcode & SDK Audit Information ==="
          xcodebuild -version
          xcode-select -p
          echo "iOS SDK Version:"
          xcrun --sdk iphoneos --show-sdk-version
          echo "iOS SDK Path:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build & Archive iOS App (Release Mode)
        run: |
          xcodebuild -project Miran.xcodeproj \
            -scheme Miran \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Miran.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
