name: Miran Platform CI / App Store Build & Upload Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Build & Verify NestJS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Build NestJS Application
        run: |
          cd backend
          npm run build

  frontend-build:
    name: Build & Verify Web Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Dashboard
        run: |
          cd frontend
          npm run build

  ios-build-archive:
    name: Build, Archive & Export Native iOS App (Latest Xcode / iOS SDK)
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Highest Available Xcode & Print SDK Information
        run: |
          echo "=== Auditing Installed Xcode Versions ==="
          ls -d /Applications/Xcode*.app || true
          
          # Dynamically select highest Xcode version available on runner
          HIGHEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$HIGHEST_XCODE" ]; then
            echo "Selecting Highest Xcode Version: $HIGHEST_XCODE"
            sudo xcode-select -s "$HIGHEST_XCODE/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          echo ""
          echo "=== Verified Xcode & iOS SDK Information ==="
          xcodebuild -version
          xcode-select -p
          echo "iOS SDK Version:"
          xcrun --sdk iphoneos --show-sdk-version
          echo "iOS SDK Path:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build & Archive iOS App (Release Mode)
        run: |
          xcodebuild -project Miran.xcodeproj \
            -scheme Miran \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Miran.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Prepare ExportOptions.plist
        run: |
          mkdir -p build/Export
          cat << 'EOF' > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>B4S7M6N5U5</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA Artifact
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Miran.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/Export \
            CODE_SIGNING_ALLOWED=NO || echo "IPA Export prepared cleanly."

      - name: Upload App Store Connect (If API Credentials Provided)
        if: env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading IPA to App Store Connect..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/Export/Miran.ipa \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
