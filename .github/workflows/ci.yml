name: Miran Platform CI / Dynamic Xcode SDK Audit & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Build & Verify NestJS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Build NestJS Application
        run: |
          cd backend
          npm run build

  frontend-build:
    name: Build & Verify Web Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Dashboard
        run: |
          cd frontend
          npm run build

  ios-build-archive:
    name: Dynamic Xcode & SDK Audit iOS Build
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Newest Installed Xcode & Audit SDK
        run: |
          chmod +x ci_scripts/*.sh 2>/dev/null || true
          ./ci_scripts/ci_pre_xcodebuild.sh

      - name: Build & Archive iOS Native App
        run: |
          xcodebuild -project Miran.xcodeproj \
            -scheme Miran \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Miran.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
