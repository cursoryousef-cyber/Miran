name: Miran Platform CI / Build Environment Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Build & Verify NestJS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Build NestJS Application
        run: |
          cd backend
          npm run build

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test

  frontend-build:
    name: Build & Verify Web Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Dashboard
        run: |
          cd frontend
          npm run build

  ios-build-archive:
    name: Runner Xcode & SDK Audit iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Build Environment
        run: |
          echo "================ Xcode Version ================"
          xcodebuild -version

          echo "================ Active Developer ================"
          xcode-select -p

          echo "================ iPhoneOS SDK ================"
          xcrun --sdk iphoneos --show-sdk-version

          echo "================ Installed SDKs ================"
          xcodebuild -showsdks

          echo "================ Installed Xcode Apps ================"
          ls -1 /Applications | grep Xcode || true

          echo "================ DEVELOPER_DIR ================"
          echo "${DEVELOPER_DIR:-Not Set}"

          echo "================ Build Settings ================"
          xcodebuild \
            -project Miran.xcodeproj \
            -scheme Miran \
            -showBuildSettings | grep -E "SDKROOT|SDK_NAME|DEVELOPER_DIR|TOOLCHAINS|IPHONEOS_DEPLOYMENT_TARGET|SUPPORTED_PLATFORMS|EFFECTIVE_PLATFORM_NAME"

          echo "================ xcrun Paths ================"
          xcrun --find xcodebuild

          echo "================ Archive Toolchain ================"
          xcrun xcodebuild -version

      - name: Build & Verify iOS Native App
        run: |
          xcodebuild -project Miran.xcodeproj \
            -scheme Miran \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
