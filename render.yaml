services:
  - type: web
    name: miran-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    # Applies committed migrations only — no schema drift from `db push`, and no
    # automatic seed. `src/seed/seed.ts` upserts a full legacy demo dataset by
    # fixed codes (HEALTH-HOLDING, NB-CLUSTER, etc.); running it on every boot
    # would silently repopulate that demo data into production. The script is
    # kept for deliberate, manual use — it is never invoked by a normal boot.
    startCommand: npx prisma migrate deploy && node dist/main.js
    # `health` is deliberately excluded from the api/v1 prefix in main.ts
    # (setGlobalPrefix's `exclude`), so the real route is /health, not
    # /api/v1/health. Pointing Render's health check at the prefixed path made
    # every check fail — a strong candidate for why new deploys weren't being
    # promoted despite the dashboard showing the target commit as pulled.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CARD_HMAC_SECRET
        generateValue: true
