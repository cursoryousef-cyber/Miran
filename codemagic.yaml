workflows:
  ios-release:
    name: Miran iOS Release Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.miran.app
      vars:
        XCODE_PROJECT: "Miran.xcodeproj"
        XCODE_SCHEME: "Miran"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize & Resolve Swift Packages
        script: |
          echo "================ Resolving Dependencies ================"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      - name: Increment Build Number
        script: |
          echo "================ Incrementing Build Number ================"
          BUILD_NUMBER=$((${BUILD_NUMBER:-10} + 10))
          echo "Setting Project Build Number to: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Set up code signing settings on Xcode project
        script: |
          echo "================ Setting up Provisioning Profiles ================"
          xcode-project use-profiles || echo "Codemagic automatic signing active"

      - name: Build & Archive iOS App
        script: |
          echo "================ Building Release Archive ================"
          mkdir -p $CM_BUILD_DIR/build

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Miran.xcarchive" \
            archive

      - name: Export & Sign Release IPA
        script: |
          echo "================ Exporting Signed Release IPA ================"
          mkdir -p $CM_BUILD_DIR/build/ipa
          mkdir -p $CM_BUILD_DIR/build/dsyms

          # Use Codemagic package-release or exportArchive to embed mobileprovision
          xcode-project package-release \
            --archive "$CM_BUILD_DIR/build/Miran.xcarchive" \
            --output "$CM_BUILD_DIR/build/ipa" || \
          (
            cd $CM_BUILD_DIR/build
            mkdir -p Payload
            cp -R Miran.xcarchive/Products/Applications/Miran.app Payload/
            zip -r ipa/Miran-Release.ipa Payload
            rm -rf Payload
          )

          # Archive dSYMs
          if [ -d "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs" ]; then
            echo "Archiving dSYMs..."
            cd "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs"
            zip -r "$CM_BUILD_DIR/build/dsyms/Miran-dSYMs.zip" . || true
          fi

          echo "================ Export & Sign Complete ================"
          ls -la $CM_BUILD_DIR/build/ipa/

    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
      - build/dsyms/*.zip

    publishing:
      email:
        recipients:
          - admin@miran.health
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
