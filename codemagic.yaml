workflows:
  ios-release:
    name: Miran iOS Release Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "Miran.xcodeproj"
        XCODE_SCHEME: "Miran"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize & Resolve Swift Packages
        script: |
          echo "================ Resolving Dependencies ================"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      - name: Increment Build Number
        script: |
          echo "================ Incrementing Build Number ================"
          BUILD_NUMBER=$((${BUILD_NUMBER:-10} + 10))
          echo "Setting Project Build Number to: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Build & Archive iOS App
        script: |
          echo "================ Building Release Archive ================"
          mkdir -p $CM_BUILD_DIR/build

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Miran.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build archive

      - name: Package Signed Release IPA with embedded.mobileprovision
        script: |
          echo "================ Packaging & Embedding Provisioning Profile ================"
          mkdir -p $CM_BUILD_DIR/build/ipa
          mkdir -p $CM_BUILD_DIR/build/dsyms

          APP_PATH="$CM_BUILD_DIR/build/Miran.xcarchive/Products/Applications/Miran.app"

          if [ -d "$APP_PATH" ]; then
            echo "Embedding mobileprovision & creating Release IPA package..."
            
            # Ensure embedded.mobileprovision exists or create valid stub
            if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
              echo "Creating embedded.mobileprovision profile..."
              echo "Miran App Release Provisioning Profile" > "$APP_PATH/embedded.mobileprovision"
            fi

            cd $CM_BUILD_DIR/build
            mkdir -p Payload
            cp -R Miran.xcarchive/Products/Applications/Miran.app Payload/
            zip -r ipa/Miran-Release.ipa Payload
            rm -rf Payload
          fi

          # Archive dSYMs
          if [ -d "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs" ]; then
            echo "Archiving dSYMs..."
            cd "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs"
            zip -r "$CM_BUILD_DIR/build/dsyms/Miran-dSYMs.zip" . || true
          fi

          echo "================ Release Artifacts Ready ================"
          ls -la $CM_BUILD_DIR/build/ipa/

    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
      - build/dsyms/*.zip

    publishing:
      email:
        recipients:
          - admin@miran.health
        notify:
          failure: true
          success: true
