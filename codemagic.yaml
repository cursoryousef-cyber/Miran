workflows:
  ios-release:
    name: Miran iOS Release Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.miran.app
      vars:
        XCODE_PROJECT: "Miran.xcodeproj"
        XCODE_SCHEME: "Miran"
        DEVELOPMENT_TEAM: "B4S7M6N5U5"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize & Resolve Swift Packages
        script: |
          echo "================ Resolving Dependencies ================"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      - name: Increment Build Number
        script: |
          echo "================ Incrementing Build Number ================"
          BUILD_NUMBER=$((${BUILD_NUMBER:-10} + 10))
          echo "Setting Project Build Number to: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Set up code signing settings on Xcode project
        script: |
          echo "================ Configuring Codemagic Automatic Code Signing ================"
          xcode-project use-profiles --profile-type=app_store

      - name: Build & Archive iOS App
        script: |
          echo "================ Building Release Archive ================"
          mkdir -p $CM_BUILD_DIR/build

          if [ -d "Miran.xcworkspace" ]; then
            BUILD_TARGET_FLAG="-workspace Miran.xcworkspace"
          else
            BUILD_TARGET_FLAG="-project $XCODE_PROJECT"
          fi

          xcodebuild \
            $BUILD_TARGET_FLAG \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Miran.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=B4S7M6N5U5 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            archive

      - name: Package Official Signed IPA & Verify embedded.mobileprovision
        script: |
          echo "================ Packaging Signed Release IPA ================"
          mkdir -p $CM_BUILD_DIR/build/ipa
          mkdir -p $CM_BUILD_DIR/build/dsyms

          # Export App Store signed IPA via official Codemagic CLI
          xcode-project package-release \
            --archive "$CM_BUILD_DIR/build/Miran.xcarchive" \
            --output "$CM_BUILD_DIR/build/ipa"

          # Verify embedded.mobileprovision in IPA package
          echo "================ Verifying embedded.mobileprovision ================"
          IPA_PATH=$(find $CM_BUILD_DIR/build/ipa -name "*.ipa" | head -n 1)

          if [ -n "$IPA_PATH" ]; then
            echo "Inspecting IPA package: $IPA_PATH"
            unzip -q "$IPA_PATH" -d /tmp/ipa_check
            if [ -f "/tmp/ipa_check/Payload/Miran.app/embedded.mobileprovision" ]; then
              echo "✅ SUCCESS: embedded.mobileprovision is verified inside IPA!"
            else
              echo "❌ ERROR: embedded.mobileprovision is missing!"
              exit 1
            fi
            rm -rf /tmp/ipa_check
          else
            echo "❌ ERROR: No IPA package exported!"
            exit 1
          fi

          # Archive dSYMs
          if [ -d "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs" ]; then
            echo "Archiving dSYMs..."
            cd "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs"
            zip -r "$CM_BUILD_DIR/build/dsyms/Miran-dSYMs.zip" . || true
          fi

    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
      - build/dsyms/*.zip

    publishing:
      email:
        recipients:
          - admin@miran.health
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
