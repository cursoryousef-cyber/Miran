workflows:
  ios-release:
    name: Miran iOS Release Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "Miran.xcodeproj"
        XCODE_SCHEME: "Miran"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize & Resolve Swift Packages
        script: |
          echo "================ Resolving Dependencies ================"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      - name: Build & Archive iOS App
        script: |
          echo "================ Building Release Archive ================"
          mkdir -p $CM_BUILD_DIR/build

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Miran.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build archive

      - name: Package Release IPA & dSYMs
        script: |
          echo "================ Packaging Release Artifacts ================"
          mkdir -p $CM_BUILD_DIR/build/ipa
          mkdir -p $CM_BUILD_DIR/build/dsyms

          # Package Payload IPA
          if [ -d "$CM_BUILD_DIR/build/Miran.xcarchive/Products/Applications/Miran.app" ]; then
            echo "Creating Release IPA package..."
            cd $CM_BUILD_DIR/build
            mkdir -p Payload
            cp -R Miran.xcarchive/Products/Applications/Miran.app Payload/
            zip -r ipa/Miran-Release.ipa Payload
            rm -rf Payload
          fi

          # Archive dSYMs
          if [ -d "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs" ]; then
            echo "Archiving dSYMs..."
            cd "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs"
            zip -r "$CM_BUILD_DIR/build/dsyms/Miran-dSYMs.zip" . || true
          fi

          echo "================ Build Artifacts Ready ================"
          ls -la $CM_BUILD_DIR/build/ipa/
          ls -la $CM_BUILD_DIR/build/dsyms/

    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
      - build/dsyms/*.zip

    publishing:
      email:
        recipients:
          - admin@miran.health
        notify:
          failure: true
          success: true
