workflows:
  ios-release:
    name: Miran iOS Release Pipeline (App Store Signed)
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic API Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.miran.app
      vars:
        XCODE_PROJECT: "Miran.xcodeproj"
        XCODE_SCHEME: "Miran"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize & Resolve Swift Packages
        script: |
          echo "================ Resolving Dependencies ================"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      - name: Increment Build Number
        script: |
          echo "================ Incrementing Build Number ================"
          BUILD_NUMBER=$((${BUILD_NUMBER:-10} + 10))
          echo "Setting Project Build Number to: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Automatic Code Signing & Fetch Profiles from Apple
        script: |
          echo "================ Fetching Distribution Certificates & Profiles ================"
          xcode-project use-profiles --profile-type=app_store

      - name: Build & Archive iOS App (App Store Automatic Signing)
        script: |
          echo "================ Building App Store Release Archive ================"
          mkdir -p $CM_BUILD_DIR/build

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Miran.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Export App Store Signed IPA & Verify embedded.mobileprovision
        script: |
          echo "================ Exporting App Store Signed Release IPA ================"
          mkdir -p $CM_BUILD_DIR/build/ipa
          mkdir -p $CM_BUILD_DIR/build/dsyms

          # Export signed App Store IPA using Codemagic CLI
          xcode-project package-release \
            --archive "$CM_BUILD_DIR/build/Miran.xcarchive" \
            --output "$CM_BUILD_DIR/build/ipa"

          # Verify embedded.mobileprovision exists in IPA
          echo "================ Verifying App Store IPA Signing ================"
          IPA_PATH=$(find $CM_BUILD_DIR/build/ipa -name "*.ipa" | head -n 1)

          if [ -n "$IPA_PATH" ]; then
            echo "Inspecting IPA Package at: $IPA_PATH"
            unzip -q "$IPA_PATH" -d /tmp/ipa_inspect
            
            if [ -f "/tmp/ipa_inspect/Payload/Miran.app/embedded.mobileprovision" ]; then
              echo "✅ SUCCESS: embedded.mobileprovision is present and valid in App Store IPA!"
            else
              echo "❌ ERROR: embedded.mobileprovision is missing in IPA bundle!"
              exit 1
            fi
            
            rm -rf /tmp/ipa_inspect
          else
            echo "❌ ERROR: No IPA package exported!"
            exit 1
          fi

          # Archive dSYMs for App Store symbolication
          if [ -d "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs" ]; then
            echo "Archiving dSYMs..."
            cd "$CM_BUILD_DIR/build/Miran.xcarchive/dSYMs"
            zip -r "$CM_BUILD_DIR/build/dsyms/Miran-dSYMs.zip" . || true
          fi

    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
      - build/dsyms/*.zip

    publishing:
      email:
        recipients:
          - admin@miran.health
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
