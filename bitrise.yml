format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

app:
  envs:
  - BITRISE_PROJECT_PATH: Miran.xcodeproj
  - BITRISE_SCHEME: Miran
  - BITRISE_DISTRIBUTION_TYPE: app-store
  - BITRISE_DEPLOY_DIR: $BITRISE_DEPLOY_DIR

meta:
  bitrise.io:
    stack: osx-xcode-15.x

workflows:
  archive_and_export_app:
    summary: Production Release Archive, App Store IPA Export, and TestFlight Deployment.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        title: Ensure Built Web Frontend & Resolve Xcode Dependencies
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            echo "================ Building Web Frontend Assets ================"
            cd frontend
            npm install
            npx tsc -b
            npm run build
            cd ..
            echo "================ Resolving Xcode Dependencies ================"
            xcodebuild -resolvePackageDependencies -project "$BITRISE_PROJECT_PATH"
    - manage-ios-code-signing@1:
        inputs:
        - distribution_type: app-store
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - configuration: Release
        - distribution_method: app-store
        - export_method: app-store
        - automatic_code_signing: api-key
    - script@1:
        title: Hard IPA Verification Assertion (FAIL IF MISSING)
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            echo "================ HARD IPA VERIFICATION =================="
            echo "Searching for exported IPA in $BITRISE_DEPLOY_DIR..."
            
            find "$BITRISE_DEPLOY_DIR" -name "*.ipa" -print
            
            FOUND_IPA=$(find "$BITRISE_DEPLOY_DIR" -name "*.ipa" 2>/dev/null | head -n 1)
            
            if [ -n "$FOUND_IPA" ]; then
              echo "✅ ASSERTION SUCCESS: Found App Store IPA at $FOUND_IPA"
              ls -lh "$FOUND_IPA"
            else
              echo "❌ CRITICAL FAILURE: No .ipa file found in $BITRISE_DEPLOY_DIR!"
              exit 1
            fi
    - deploy-to-itunesconnect-deliver@3:
        inputs:
        - connection: api_key
    - deploy-to-bitrise-io@2:
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR"

  build:
    summary: Default build workflow alias.
    before_run:
    - archive_and_export_app

  release:
    summary: Release workflow alias.
    before_run:
    - archive_and_export_app

  primary:
    summary: Primary workflow alias.
    before_run:
    - archive_and_export_app

trigger_map:
- push_branch: "*"
  workflow: archive_and_export_app
- pull_request_source_branch: "*"
  workflow: archive_and_export_app
