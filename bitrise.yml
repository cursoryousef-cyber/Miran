format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

app:
  envs:
  - BITRISE_PROJECT_PATH: Miran.xcodeproj
  - BITRISE_SCHEME: Miran
  - BITRISE_DISTRIBUTION_TYPE: app-store
  - BITRISE_DEPLOY_DIR: $BITRISE_DEPLOY_DIR

meta:
  bitrise.io:
    stack: osx-xcode-15.x

workflows:
  release:
    summary: Build Xcode Release Archive, export App Store IPA, and deploy artifact to Bitrise & TestFlight.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        title: Ensure Built Web Frontend & Resolve Dependencies
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            echo "================ Building Web Frontend Assets ================"
            cd frontend
            npm install
            npx tsc -b
            npm run build
            cd ..
            echo "================ Resolving Xcode Dependencies ================"
            xcodebuild -resolvePackageDependencies -project "$BITRISE_PROJECT_PATH"
    - manage-ios-code-signing@1:
        inputs:
        - distribution_type: app-store
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - configuration: Release
        - distribution_method: app-store
        - export_method: app-store
        - automatic_code_signing: api-key
    - script@1:
        title: Verify & Export Miran.ipa (FAIL IF MISSING)
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            echo "================ Verifying Miran.ipa Artifact ================"
            mkdir -p "$BITRISE_DEPLOY_DIR"
            
            # Find exported IPA
            IPA_PATH=$(find "$BITRISE_DEPLOY_DIR" ~/Library/Developer/Xcode/Archives -name "*.ipa" 2>/dev/null | head -n 1)
            
            if [ -z "$IPA_PATH" ]; then
              echo "⚠️ IPA file not automatically placed in deploy dir. Checking Xcode archive..."
              ARCHIVE_PATH=$(find "$BITRISE_DEPLOY_DIR" ~/Library/Developer/Xcode/Archives -name "*.xcarchive" 2>/dev/null | head -n 1)
              
              if [ -n "$ARCHIVE_PATH" ]; then
                echo "Found Archive: $ARCHIVE_PATH. Packaging IPA..."
                mkdir -p /tmp/ipa_pack/Payload
                cp -R "$ARCHIVE_PATH/Products/Applications/"*.app /tmp/ipa_pack/Payload/
                cd /tmp/ipa_pack
                zip -r "$BITRISE_DEPLOY_DIR/Miran.ipa" Payload
                IPA_PATH="$BITRISE_DEPLOY_DIR/Miran.ipa"
              fi
            else
              if [ "$IPA_PATH" != "$BITRISE_DEPLOY_DIR/Miran.ipa" ]; then
                cp "$IPA_PATH" "$BITRISE_DEPLOY_DIR/Miran.ipa"
              fi
            fi
            
            # Final Assertion Check
            if [ -f "$BITRISE_DEPLOY_DIR/Miran.ipa" ]; then
              echo "✅ SUCCESS: Miran.ipa verified at $BITRISE_DEPLOY_DIR/Miran.ipa"
              ls -lh "$BITRISE_DEPLOY_DIR/Miran.ipa"
            else
              echo "❌ CRITICAL ERROR: Miran.ipa was NOT created! Failing build."
              exit 1
            fi
    - deploy-to-itunesconnect-deliver@3:
        inputs:
        - connection: api_key
    - deploy-to-bitrise-io@2:
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR"

  build:
    summary: Entrypoint workflow triggered by Bitrise default triggers. Executes release workflow.
    before_run:
    - release

  primary:
    summary: Primary workflow entrypoint. Executes release workflow.
    before_run:
    - release

trigger_map:
- push_branch: "*"
  workflow: release
- pull_request_source_branch: "*"
  workflow: release
