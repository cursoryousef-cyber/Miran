format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

app:
  envs:
  - BITRISE_PROJECT_PATH: Miran.xcodeproj
  - BITRISE_SCHEME: Miran
  - BITRISE_DISTRIBUTION_TYPE: app-store
  - BITRISE_DEPLOY_DIR: $BITRISE_DEPLOY_DIR

meta:
  bitrise.io:
    stack: osx-xcode-15.x

workflows:
  build:
    summary: Default Bitrise build workflow. Executes full Release Archive, IPA Export, and TestFlight Deployment.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        title: Ensure Built Web Frontend & Resolve Xcode Dependencies
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            echo "================ Building Web Frontend Assets ================"
            cd frontend
            npm install
            npx tsc -b
            npm run build
            cd ..
            echo "================ Resolving Xcode Dependencies ================"
            xcodebuild -resolvePackageDependencies -project "$BITRISE_PROJECT_PATH"
    - manage-ios-code-signing@1:
        inputs:
        - distribution_type: app-store
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - configuration: Release
        - distribution_method: app-store
        - export_method: app-store
        - automatic_code_signing: api-key
    - script@1:
        title: Verify & Export Miran.ipa (FAIL BUILD IF MISSING)
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            echo "================ Verifying Miran.ipa Artifact ================"
            mkdir -p "$BITRISE_DEPLOY_DIR"
            
            # 1. Look for pre-exported IPA
            FOUND_IPA=$(find "$BITRISE_DEPLOY_DIR" ~/Library/Developer/Xcode/Archives -name "*.ipa" 2>/dev/null | head -n 1)
            
            if [ -n "$FOUND_IPA" ]; then
              echo "Found IPA at: $FOUND_IPA"
              if [ "$FOUND_IPA" != "$BITRISE_DEPLOY_DIR/Miran.ipa" ]; then
                cp "$FOUND_IPA" "$BITRISE_DEPLOY_DIR/Miran.ipa"
              fi
            else
              echo "⚠️ IPA not found directly in deploy dir. Searching for Xcode Archive payload..."
              ARCHIVE_PATH=$(find "$BITRISE_DEPLOY_DIR" ~/Library/Developer/Xcode/Archives -name "*.xcarchive" 2>/dev/null | head -n 1)
              
              if [ -n "$ARCHIVE_PATH" ]; then
                echo "Found Archive: $ARCHIVE_PATH. Exporting Miran.ipa payload..."
                mkdir -p /tmp/ipa_pack/Payload
                cp -R "$ARCHIVE_PATH/Products/Applications/"*.app /tmp/ipa_pack/Payload/
                cd /tmp/ipa_pack
                zip -r "$BITRISE_DEPLOY_DIR/Miran.ipa" Payload
              fi
            fi
            
            # 2. Strict Assertion Check: Fail build if Miran.ipa is missing
            if [ -f "$BITRISE_DEPLOY_DIR/Miran.ipa" ]; then
              echo "✅ ASSERTION SUCCESS: Miran.ipa exists at $BITRISE_DEPLOY_DIR/Miran.ipa"
              ls -lh "$BITRISE_DEPLOY_DIR/Miran.ipa"
            else
              echo "❌ CRITICAL FAILURE: $BITRISE_DEPLOY_DIR/Miran.ipa was NOT created!"
              exit 1
            fi
    - deploy-to-itunesconnect-deliver@3:
        inputs:
        - connection: api_key
    - deploy-to-bitrise-io@2:
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR"

  release:
    summary: Release distribution workflow for App Store Connect / TestFlight.
    before_run:
    - build

  primary:
    summary: Primary workflow entrypoint.
    before_run:
    - build

trigger_map:
- push_branch: "*"
  workflow: build
- pull_request_source_branch: "*"
  workflow: build
